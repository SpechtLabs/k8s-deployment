app:
  title: SpechtLabs Backstage
  baseUrl: https://backstage.k8s.specht-labs.de

organization:
  name: SpechtLabs

backend:
  baseUrl: https://backstage.k8s.specht-labs.de
  cors:
    origin: https://backstage.k8s.specht-labs.de

auth:
  environment: production
  # The oidc provider keeps the login's state and nonce in an express session,
  # which the auth backend only enables when this is set ("authentication
  # requires session support" otherwise).
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # tsidp (Tailscale's OIDC IdP), public through Funnel, so no tailnet
    # egress is needed from the cluster. The client is registered in tsidp
    # with redirect URI
    #   https://backstage.k8s.specht-labs.de/api/auth/oidc/handler/frame
    oidc:
      production:
        metadataUrl: https://idp.sphinx-map.ts.net/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        # Backstage's default is prompt=none, which IdPs without a consent
        # screen may reject.
        prompt: auto
        signIn:
          resolvers:
            # Matches the token's email claim against a User entity's
            # spec.profile.email. tsidp's email is the tailnet login name,
            # so the User entity must carry that exact value.
            - resolver: emailMatchingUserEntityProfileEmail

# The Kubernetes plugin: this cluster, read as the pod's service account
# (no token here means the mounted one; RBAC in base/kubernetes-rbac.yaml).
# An entity opts in with backstage.io/kubernetes-label-selector or
# backstage.io/kubernetes-id.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: specht-labs
          url: https://kubernetes.default.svc
          authProvider: serviceAccount

# The ArgoCD plugin (Roadie) calls ArgoCD through this proxy endpoint, as the
# read-only `backstage` account (token: argocd.secret.yaml). Only signed-in
# Backstage users can use the proxy.
proxy:
  endpoints:
    '/argocd/api':
      # In-cluster: argocd.k8s.specht-labs.de resolves to the tailnet load
      # balancer, which pods can't reach.
      target: https://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      # argocd-server terminates TLS itself with the certificate for
      # argocd.k8s.specht-labs.de, which doesn't match the Service name.
      # The hop never leaves the cluster.
      secure: false
      headers:
        Cookie: ${ARGOCD_AUTH_TOKEN}

argocd:
  # Links from the cards to the ArgoCD UI.
  baseUrl: https://argocd.k8s.specht-labs.de

# GitHub, as the spechtlabs-backstage GitHub App (installed on the SpechtLabs
# org, all repos; credentials: github.secret.yaml). Replaces app-config.yaml's
# token-based entry for local development.
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          allowedInstallationOwners: [SpechtLabs]

# Discovery: every SpechtLabs repo's catalog-info.yaml on its default branch.
# Merges with the image's file locations (catalog/org.yaml and Backstage's
# own catalog-info.yaml).
catalog:
  providers:
    github:
      spechtlabs:
        organization: SpechtLabs
        catalogPath: /catalog-info.yaml
        schedule:
          frequency:
            minutes: 30
          timeout:
            minutes: 3
