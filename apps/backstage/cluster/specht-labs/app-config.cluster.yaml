app:
  title: SpechtLabs Backstage
  baseUrl: https://backstage.k8s.specht-labs.de

organization:
  name: SpechtLabs

backend:
  baseUrl: https://backstage.k8s.specht-labs.de
  cors:
    origin: https://backstage.k8s.specht-labs.de
  # Hosts the catalog may fetch API specs from ($text in k8s-deployment's
  # catalog), anonymously, through the plain fetch reader. Upstream specs
  # on GitHub are read from raw.githubusercontent.com: a github.com URL goes
  # through the GitHub integration, and the catalog refuses $text through an
  # integration unless it is in the entity's own repo. Limited to the repos
  # whose specs we pin.
  reading:
    allow:
      - host: docs.hetzner.cloud
      - host: api.tailscale.com
      - host: raw.githubusercontent.com
        paths:
          - /argoproj/argo-cd/
          - /grafana/grafana/
          - /grafana/loki/
          - /grafana/pyroscope/
          - /open-telemetry/opentelemetry-proto/
          - /prometheus/prometheus/
          - /SpechtLabs/tka/

auth:
  environment: production
  # The oidc provider keeps the login's state and nonce in an express session,
  # which the auth backend only enables when this is set ("authentication
  # requires session support" otherwise).
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # Not for sign-in: the user's GitHub token for the GitHub insights and
    # pull requests cards, through the spechtlabs-backstage GitHub App's
    # user authorization. The App's callback URL must include
    #   https://backstage.k8s.specht-labs.de/api/auth/github/handler/frame
    github:
      production:
        clientId: ${GITHUB_APP_CLIENT_ID}
        clientSecret: ${GITHUB_APP_CLIENT_SECRET}
    # tsidp (Tailscale's OIDC IdP), public through Funnel, so no tailnet
    # egress is needed from the cluster. The client is registered in tsidp
    # with redirect URI
    #   https://backstage.k8s.specht-labs.de/api/auth/oidc/handler/frame
    oidc:
      production:
        metadataUrl: https://idp.sphinx-map.ts.net/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        # Backstage's default is prompt=none, which IdPs without a consent
        # screen may reject.
        prompt: auto
        signIn:
          resolvers:
            # Matches the token's email claim against a User entity's
            # spec.profile.email. tsidp's email is the tailnet login name,
            # so the User entity must carry that exact value.
            - resolver: emailMatchingUserEntityProfileEmail

# The Kubernetes plugin: this cluster, read as the pod's service account
# (no token here means the mounted one; RBAC in base/kubernetes-rbac.yaml).
# An entity opts in with backstage.io/kubernetes-label-selector or
# backstage.io/kubernetes-id.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: specht-labs
          url: https://kubernetes.default.svc
          authProvider: serviceAccount

# The ArgoCD plugin (Roadie) calls ArgoCD through this proxy endpoint, as the
# read-only `backstage` account (token: argocd.secret.yaml). Only signed-in
# Backstage users can use the proxy.
proxy:
  endpoints:
    '/argocd/api':
      # In-cluster: argocd.k8s.specht-labs.de resolves to the tailnet load
      # balancer, which pods can't reach.
      target: https://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      # argocd-server terminates TLS itself with the certificate for
      # argocd.k8s.specht-labs.de, which doesn't match the Service name.
      # The hop never leaves the cluster.
      secure: false
      # Authorization, not ArgoCD's argocd.token cookie: the proxy's config
      # schema marks Authorization secret, so DevTools' config view redacts
      # it. A Cookie header it would show to every signed-in user.
      headers:
        Authorization: Bearer ${ARGOCD_AUTH_TOKEN}
    '/opencost':
      target: http://grafana-k8s-monitoring-opencost.monitoring.svc.cluster.local:9003
      changeOrigin: true

# OpenCost: the plugin's page fetches opencost.baseUrl from the browser, with
# the Backstage token, so it goes through this proxy endpoint to the
# in-cluster OpenCost API (grafana-k8s-monitoring's OpenCost, port 9003).
opencost:
  baseUrl: https://backstage.k8s.specht-labs.de/api/proxy/opencost

argocd:
  # Links from the cards to the ArgoCD UI.
  baseUrl: https://argocd.k8s.specht-labs.de

# GitHub, as the spechtlabs-backstage GitHub App (installed on the SpechtLabs
# org, all repos; credentials: github.secret.yaml). Replaces app-config.yaml's
# token-based entry for local development.
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          # cedi: for cedi/homelab only (the App is installed on that one
          # repo there). See catalog.locations below.
          allowedInstallationOwners: [SpechtLabs, cedi]

# Discovery: every SpechtLabs repo's catalog-info.yaml on its default branch.
# Merges with the image's file location for catalog/org.yaml; everything
# else, Backstage's own entities included, comes from here.
catalog:
  # cedi/homelab is outside the SpechtLabs org, so discovery doesn't see it;
  # its catalog (System homelab, labk3s, the tailnet, tsidp, Ceph, the NAS)
  # is registered here. This array replaces the image's catalog.locations
  # (app-config.production.yaml) rather than merging with it, so the image's
  # org.yaml entry is repeated.
  locations:
    - type: file
      target: ./catalog/org.yaml
      rules:
        - allow: [User, Group]
    - type: url
      target: https://github.com/cedi/homelab/blob/main/catalog-info.yaml
  providers:
    github:
      spechtlabs:
        organization: SpechtLabs
        catalogPath: /catalog-info.yaml
        schedule:
          frequency:
            minutes: 30
          timeout:
            minutes: 3
