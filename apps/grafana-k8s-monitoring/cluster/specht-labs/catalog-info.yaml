# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: grafana-k8s-monitoring
  title: Grafana k8s-monitoring (specht-labs)
  description: Alloy (metrics, logs, profiles, OTLP receiver), Beyla, kube-state-metrics, node-exporter and OpenCost, shipping to the in-cluster LGTM stack. Also runs the Grafana Cloud PDC agent, which lets Grafana Cloud query that stack.
  annotations:
    argocd/app-name: grafana-k8s-monitoring
    # hcloud-exporter shares the namespace; everything else there is this app's.
    backstage.io/kubernetes-namespace: monitoring
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance!=hcloud-exporter
  tags: [observability]
  links:
    - url: https://grafana.com/docs/grafana-cloud/monitor-infrastructure/kubernetes-monitoring/
      title: Kubernetes Monitoring docs
      icon: docs
    - url: https://github.com/grafana/k8s-monitoring-helm
      title: grafana/k8s-monitoring-helm
      icon: github
    - url: https://github.com/grafana/alloy
      title: grafana/alloy
      icon: github
    - url: https://github.com/grafana/pdc-agent
      title: grafana/pdc-agent
      icon: github
spec:
  type: service
  lifecycle: production
  owner: group:spechtlabs
  system: specht-labs
  providesApis:
    - api:alloy-otlp
  consumesApis:
    - api:mimir-remote-write
    - api:loki-push
    - api:tempo-otlp
    - api:pyroscope-push
    # OpenCost reads its cost inputs from Mimir.
    - api:mimir-query
  dependsOn:
    - resource:specht-labs
    # The PDC agent's tunnel.
    - component:grafana-cloud
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: alloy-otlp
  title: Alloy OTLP receiver
  description: In-cluster OTLP endpoint (grafana-k8s-monitoring-alloy-receiver.monitoring, gRPC :4317, HTTP :4318). Apps send their traces here, and Alloy forwards them to Tempo.
  tags: [observability, otlp]
  links:
    - url: https://opentelemetry.io/docs/specs/otlp/
      title: OTLP spec
      icon: docs
spec:
  type: grpc
  lifecycle: production
  owner: group:spechtlabs
  system: specht-labs
  definition:
    $text: https://raw.githubusercontent.com/open-telemetry/opentelemetry-proto/v1.5.0/opentelemetry/proto/collector/trace/v1/trace_service.proto
