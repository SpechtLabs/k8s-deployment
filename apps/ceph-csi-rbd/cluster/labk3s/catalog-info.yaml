# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ceph-csi-rbd
  annotations:
    # ArgoCD cards from the labk3s ArgoCD, through Backstage's /argocd/labk3s
    # proxy. No Kubernetes annotations: the Kubernetes plugin only knows
    # specht-labs, where the same selectors would match the wrong pods.
    argocd/app-name: ceph-csi-rbd
    argocd/proxy-url: /argocd/labk3s
    # The tag its traffic comes from on the tailnet: the labk3s nodes', as
    # Ceph clients (cedi/homelab tailscale/policy.hujson).
    specht-labs.de/tailnet-src: tag:ceph-client
  title: Ceph CSI (RBD)
  description: RBD volumes for labk3s from the storagepi Ceph cluster's k3s pool, reaching the monitors over the tailnet.
  tags: [storage, ceph]
  links:
    - url: https://docs.ceph.com/en/latest/rbd/rbd-kubernetes/
      title: Ceph RBD on Kubernetes
      icon: docs
    - url: https://github.com/ceph/ceph-csi
      title: ceph/ceph-csi
      icon: github
spec:
  type: service
  lifecycle: production
  owner: group:spechtlabs
  system: labk3s
  # The ceph system's RBD API (cedi/homelab), pool k3s as client.k3s; the
  # pool itself is internal to that system.
  consumesApis:
    - api:ceph-rbd
  dependsOn:
    - resource:labk3s
    - resource:tailnet
