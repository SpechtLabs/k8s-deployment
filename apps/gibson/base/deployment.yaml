apiVersion: apps/v1
kind: Deployment
metadata:
  name: gibson
  labels:
    app.kubernetes.io/name: gibson
spec:
  # Two, so a rollout or a node drain never leaves `ssh specht-labs.de` dark.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gibson
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gibson
      annotations:
        kubectl.kubernetes.io/default-container: gibson
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gibson
      containers:
        - name: gibson
          image: ghcr.io/spechtlabs/gibson
          args: ["serve", "--config", "/etc/gibson/gibson.yaml"]
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          # The image has no shell; gibson healthcheck reads the same config
          # and checks for an SSH banner (sending a PROXY header first).
          startupProbe:
            exec:
              command: ["/usr/local/bin/gibson", "healthcheck", "--config", "/etc/gibson/gibson.yaml"]
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            exec:
              command: ["/usr/local/bin/gibson", "healthcheck", "--config", "/etc/gibson/gibson.yaml"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/usr/local/bin/gibson", "healthcheck", "--config", "/etc/gibson/gibson.yaml"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A CPU limit, unlike most apps here: this one is open to the whole
          # internet, and a crowd of large terminals shouldn't starve the node.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gibson/gibson.yaml
              subPath: gibson.yaml
              readOnly: true
            - name: host-key
              mountPath: /etc/gibson/keys
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gibson-config
        - name: host-key
          secret:
            secretName: gibson-host-key
            defaultMode: 0440
