apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gibson

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# gibson reads /config/gibson.yaml; the hash suffix rolls the pods when it changes.
configMapGenerator:
  - name: gibson-config
    files:
      - gibson.yaml

# 0.1.1 is the first release that reads the PROXY protocol (ssh.proxy-protocol)
# and lets a mounted gibson.yaml set the host key path; don't go below it.
images:
  - name: ghcr.io/spechtlabs/gibson
    newTag: 0.1.2
