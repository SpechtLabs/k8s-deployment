apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gibson

resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# gibson reads /etc/gibson/gibson.yaml; the hash suffix rolls the pods when it changes.
configMapGenerator:
  - name: gibson-config
    files:
      - gibson.yaml

images:
  - name: ghcr.io/spechtlabs/gibson
    newTag: 0.1.0
