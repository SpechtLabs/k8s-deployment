# :22 on the shared Gateway (its ssh listener, in the envoy-gateway overlay)
# to gibson. external-dns already points specht-labs.de at the Gateway's LB.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: gibson
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: envoy-gateway-system
      sectionName: ssh
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: gibson
          port: 22
          weight: 1
