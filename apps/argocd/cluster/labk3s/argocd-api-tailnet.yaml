# The ArgoCD API on the tailnet as a Tailscale Service, svc:labk3s-argocd-api
# (labk3s-argocd-api.<tailnet>), for Backstage on specht-labs: its egress proxy
# (tag:backstage) may reach svc:labk3s-argocd-api on tcp:443 and nothing else
# (tailnet policy in SpechtLabs/homelab). Served by the tailnet-ingress ProxyGroup
# (../../../tailscale/cluster/labk3s/tailnet-ingress.proxygroup.yaml); its VIP
# outlives the proxies. It replaced the lab-argocd-api device.
#
# Why not the lab-argocd ingress: Tailscale's ingress terminates TLS and only
# answers to its own name, which the egress proxy can't present without
# cluster DNS rewiring on specht-labs. Here argocd-server terminates TLS
# itself (self-signed; Backstage's proxy skips verification, inside
# WireGuard).
#
# Don't delete or rename this Service, or change tailscale.com/hostname or
# tailscale.com/proxy-group: the operator deletes the Tailscale Service with
# it and a re-created one gets a new VIP. tailscale.com/tags tags the Tailscale
# Service (tag:k3s, the operator's default, in no grant); grants go by name.
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-tailnet-svc
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
    tailscale.com/hostname: labk3s-argocd-api
    tailscale.com/tags: tag:k3s
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
