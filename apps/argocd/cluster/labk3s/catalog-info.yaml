# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: argocd-labk3s
  annotations:
    # ArgoCD cards from the labk3s ArgoCD, through Backstage's /argocd/labk3s
    # proxy. No Kubernetes annotations: the Kubernetes plugin only knows
    # specht-labs, where the same selectors would match the wrong pods.
    argocd/app-name: argocd
    argocd/proxy-url: /argocd/labk3s
  title: Argo CD (labk3s)
  description: Syncs every app in argo-apps/labk3s to the labk3s cluster. Its UI is the Tailscale Service svc:lab-argocd (https://lab-argocd.sphinx-map.ts.net, tailnet only), its API svc:labk3s-argocd-api, both on the labk3s tailnet-ingress ProxyGroup.
  tags: [gitops]
  links:
    - url: https://lab-argocd.sphinx-map.ts.net
      title: Argo CD UI (labk3s)
    - url: https://argo-cd.readthedocs.io
      title: Argo CD docs
      icon: docs
    - url: https://github.com/argoproj/argo-cd
      title: argoproj/argo-cd
      icon: github
    - url: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
      title: Helm chart
spec:
  type: service
  lifecycle: production
  owner: group:spechtlabs
  system: labk3s
  providesApis:
    - api:argocd-labk3s-api
    - api:argocd-labk3s-web
  consumesApis:
    - api:tsidp-oidc
  dependsOn:
    - resource:labk3s
    - resource:tailnet
    - component:github
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: argocd-labk3s-api
  title: Argo CD API (labk3s)
  description: Argo CD's REST API on labk3s.
  annotations:
    # Where tailnet consumers reach it; Backstage renders the tailnet policy's
    # grants from these (SpechtLabs/homelab tailscale/policy/).
    # svc:labk3s-argocd-api is argocd-server-tailnet-svc, on the
    # tailnet-ingress ProxyGroup.
    specht-labs.de/tailnet-dst: svc:labk3s-argocd-api
    specht-labs.de/tailnet-ports: tcp:443
  tags: [gitops, rest]
  links:
    - url: https://argo-cd.readthedocs.io/en/stable/developer-guide/api-docs/
      title: API docs
      icon: docs
spec:
  type: openapi
  lifecycle: production
  owner: group:spechtlabs
  system: labk3s
  definition:
    $text: https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.2/assets/swagger.json
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: argocd-labk3s-web
  title: Argo CD UI (labk3s)
  description: The labk3s Argo CD's web UI, https://lab-argocd.sphinx-map.ts.net; sign-in through tsidp.
  annotations:
    # Admins and SREs reach it through the Tailscale Service svc:lab-argocd
    # (Ingress argocd-server on the tailnet-ingress ProxyGroup). Backstage
    # renders the tailnet policy's grants from these (SpechtLabs/homelab
    # tailscale/policy/).
    specht-labs.de/tailnet-dst: svc:lab-argocd
    specht-labs.de/tailnet-ports: tcp:443
    specht-labs.de/tailnet-allow: group:admins, group:sre
  tags: [gitops, web]
spec:
  type: http
  lifecycle: production
  owner: group:spechtlabs
  system: labk3s
  definition: |
    https://lab-argocd.sphinx-map.ts.net (svc:lab-argocd, tcp:443), tailnet
    only. Sign-in through tsidp: group:sre and group:admins.
