apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ../../base/
  - argocd-api-tailnet.yaml

generators:
  - ./secret-generator.yaml

patches:
  - path: delete-sm-server.yaml
  - path: delete-sm-repo-server.yaml
  - path: delete-sm-redis.yaml
  - path: delete-sm-dex.yaml
  - path: delete-sm-app-controller.yaml
  - path: delete-sm-appset-controller.yaml
  - target:
      kind: Role
      namespace: argocd
      name: argocd-server
    path: webterminal-role.patch.yaml

  - target:
      kind: Ingress
      namespace: argocd
      name: argocd-server
    patch: |-
      - op: replace
        path: "/spec/ingressClassName"
        value: tailscale

      - op: remove
        path: "/spec/rules/0/host"

      - op: replace
        path: "/spec/tls/0/hosts/0"
        value: lab-argocd

      # Served by the tailnet-ingress ProxyGroup (../../../tailscale/cluster/
      # labk3s/tailnet-ingress.proxygroup.yaml) as the Tailscale Service
      # svc:lab-argocd, https://lab-argocd.<tailnet>: the name in Argo CD's url
      # and the Dex redirect URI. The proxies share one Let's Encrypt cert for
      # it. Don't change the TLS host or the proxy-group: the operator deletes
      # the Tailscale Service with them.
      - op: add
        path: "/metadata/annotations/tailscale.com~1proxy-group"
        value: "tailnet-ingress"

      # Tailnet only, no Funnel. On a ProxyGroup Ingress tailscale.com/tags
      # tags the Tailscale Service, not the proxies: tag:k3s, the labk3s
      # operator's default, in no grant (access goes by svc:lab-argocd).
      - op: add
        path: "/metadata/annotations/tailscale.com~1tags"
        value: "tag:k3s"

      # The Tailscale ingress terminates TLS itself; with this annotation
      # cert-manager's ingress-shim kept requesting an LE cert for the bare
      # name "lab-argocd", which can never be issued.
      - op: remove
        path: "/metadata/annotations/cert-manager.io~1cluster-issuer"

  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      - op: replace
        path: "/data/dex.config"
        value: |
          connectors:
            - type: oidc
              id: oidc
              name: Tailscale
              config:
                issuer: https://idp.sphinx-map.ts.net
                clientID: $argocd-oidc:tailscale.clientID
                clientSecret: $argocd-oidc:tailscale.clientSecret
                redirectURI: https://lab-argocd.sphinx-map.ts.net/api/dex/callback
                scopes:
                  - openid
                getUserInfo: true
                Default: username
                claimMapping:
                  Default: username

      - op: replace
        path: "/data/url"
        value: https://lab-argocd.sphinx-map.ts.net

      # Backstage's ArgoCD plugin (on specht-labs): an API-key-only account
      # (no UI login). Read access comes from rbac policy.default
      # (role:readonly); its token is in k8s-deployment
      # apps/backstage/cluster/specht-labs/argocd.secret.yaml.
      - op: add
        path: "/data/accounts.backstage"
        value: apiKey

  - target:
      kind: ConfigMap
      name: argocd-rbac-cm
    patch: |-
      - op: replace
        path: "/data/policy.csv"
        value: |-
          p, role:org-admin, *, *, *, allow
          p, role:viewer, *, get, *, allow
          g, cedi@github, role:org-admin
          g, cedi@github.idp.sphinx-map.ts.net, role:org-admin
          g, cedi, role:org-admin

      - op: replace
        path: "/data/scopes"
        value: "[username,email]"
