apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bogen-web
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
      namespace: envoy-gateway-system
      port: 443
  hostnames:
    - bogen.kienzlers-world.de
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: bogen-web
          port: 80
          weight: 1
