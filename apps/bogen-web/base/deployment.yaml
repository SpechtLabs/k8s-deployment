apiVersion: apps/v1
kind: Deployment
metadata:
  name: bogen-web
  labels:
    app.kubernetes.io/name: bogen-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: bogen-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bogen-web
      annotations:
        kubectl.kubernetes.io/default-container: bogen-web
    spec:
      # A public, legacy PHP CMS: assume it gets compromised and leave it
      # nothing to escalate with. No API credentials, no service discovery
      # environment, no root, no capabilities, no writable image.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33 # www-data in the image
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bogen-web
          # Pinned by digest so a new image is an explicit, reviewed rollout
          # (Renovate bumps the digest) instead of whatever :latest was when
          # the pod last happened to restart.
          image: ghcr.io/fam-kienzler/bogen-blog:latest@sha256:eebc6c3c901c8364e9aa9e5a0e53e24e77196b1538312bf1a29fe472af03aebd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # PHP sessions and Apache's pid/lock files; the site itself is
            # read-only in the image.
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 1Gi # 512Mi: peaked 511Mi, OOM-killed
              ephemeral-storage: 512Mi
      volumes:
        # Disk-backed: CMSimple opens a session on every request, so a crawler
        # burst would fill a small memory-backed /tmp and get the pod evicted.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
