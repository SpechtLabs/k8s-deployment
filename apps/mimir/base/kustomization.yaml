apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lgtm

helmCharts:
  - name: mimir-distributed
    repo: https://grafana.github.io/helm-charts
    version: 6.2.2
    releaseName: mimir
    namespace: lgtm
    valuesFile: helm-values.yaml
    # rollout-operator's ZoneAwarePodDisruptionBudget/ReplicaTemplate CRDs ship
    # in its crds/ dir, which kustomize skips by default.
    includeCRDs: true
