# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: php-web-hoster
  annotations:
    # ArgoCD cards from the labk3s ArgoCD, through Backstage's /argocd/labk3s
    # proxy. No Kubernetes annotations: the Kubernetes plugin only knows
    # specht-labs, where the same selectors would match the wrong pods.
    argocd/app-name: php-web-hoster
    argocd/proxy-url: /argocd/labk3s
  title: php-web-hoster
  description: Hosts a PHP site (Apache + PHP 8.1), with SFTPGo for uploads and an rclone sync, on an NFS-backed volume. Served on the tailnet as php-web-hoster, with the SFTPGo admin at php-web-hoster-admin.
  tags: [website, php]
  links:
    - url: https://github.com/drakkan/sftpgo
      title: drakkan/sftpgo
      icon: github
    - url: https://rclone.org
      title: rclone.org
spec:
  type: website
  lifecycle: experimental
  owner: group:spechtlabs
  system: homelab
  dependsOn:
    - resource:labk3s
    - resource:tailnet
    - component:tailscale-labk3s
    # Its php-web-hoster-retain StorageClass.
    - component:csi-driver-nfs
