# SLO hlclockptp: Homelab — clock accuracy (PTP clients). Applied to Grafana Cloud by slo-sync (slo-sync-job.yaml).
apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: hlclockptp
spec:
  name: Homelab — clock accuracy (PTP clients)
  description: >-
    Share of host-minutes in which a PTP client's clock (ptp4l slave of timepi's grandmaster, read by
    chrony: the Pi 5s, the CM4 blades, jumphost) was within 10 µs of its source. PTP with hardware timestamps
    normally holds ~10-70 ns; 7-day baseline before 2026-11-24: 99.82% within 10 µs, 99.0% within 1 µs.
    Offsets are chrony's to its source, so this measures distribution across the LAN; whether timepi itself
    is on GPS time is the timepi stratum-1 SLO.
  destinationDatasource:
    uid: mimir-homelab
  query:
    type: freeform
    freeform:
      query: >-
        sum(count_over_time(((abs(chrony_tracking_system_offset_seconds) and on(instance) ptp4l_port_slave)
        < 0.00001)[$__rate_interval:1m])) / sum(count_over_time((abs(chrony_tracking_system_offset_seconds)
        and on(instance) ptp4l_port_slave)[$__rate_interval:1m]))
  objectives:
  - value: 0.995
    window: 28d
  labels:
  - key: service_name
    value: time-sync
  - key: team_name
    value: homelab
  - key: site
    value: homelab
  alerting:
    labels:
    - key: service
      value: time-sync
    fastBurn:
      labels:
      - key: severity
        value: critical
      annotations:
      - key: summary
        value: >-
          Homelab — clock accuracy (PTP clients) is burning its error budget fast (clocks more than 10
          µs off).
    slowBurn:
      labels:
      - key: severity
        value: warning
      annotations:
      - key: summary
        value: Homelab — clock accuracy (PTP clients) is burning its error budget slowly.
