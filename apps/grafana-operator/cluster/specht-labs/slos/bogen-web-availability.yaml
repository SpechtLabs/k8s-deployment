# SLO bogenwebavail: Bogen Web — Availability. Applied to Grafana Cloud by slo-sync (slo-sync-job.yaml).
apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: bogenwebavail
spec:
  name: Bogen Web — Availability
  description: >-
    Share of requests to Bogen Web that Envoy Gateway answered without a 5xx, per envoy_cluster_upstream_rq_xx
    on route httproute/bogen-web/bogen-web/rule/0. Envoy charges a 503 here too when the route has no
    healthy endpoint (pods down), so this catches a dead backend as well as one that errors. 4xx (404s
    from scanners, auth) are served responses, not failures. Measured at the gateway, so kubelet probes
    don't dilute it. ≈1–2k requests/day, 0 5xx in the 3 days to 2026-11-24; 99.5% leaves ≈200 failed requests
    per 28d.
  destinationDatasource:
    uid: mimir-spechtlabs
  query:
    type: ratio
    ratio:
      successMetric:
        prometheusMetric: >-
          envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/bogen-web/bogen-web/rule/0", envoy_response_code_class!="5"}
      totalMetric:
        prometheusMetric: envoy_cluster_upstream_rq_xx{envoy_cluster_name="httproute/bogen-web/bogen-web/rule/0"}
      groupByLabels: []
  objectives:
  - value: 0.995
    window: 28d
  labels:
  - key: service_name
    value: bogen-web
  - key: team_name
    value: specht-labs
  - key: tier
    value: app
  - key: sli
    value: availability
  alerting:
    labels:
    - key: service
      value: bogen-web
    fastBurn:
      labels:
      - key: severity
        value: critical
      annotations:
      - key: summary
        value: Bogen Web is failing requests fast (5xx / no healthy upstream at the gateway).
    slowBurn:
      labels:
      - key: severity
        value: warning
      annotations:
      - key: summary
        value: Bogen Web is failing a small share of requests over hours.
