# SLO hlnasavail: Homelab — NAS (DSM) availability. Applied by grafana-operator (grafana/slos (cedi, 2026-11-24)).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: slo-hlnasavail
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  template:
    apiVersion: slo.ext.grafana.app/v1alpha1
    kind: SLO
    metadata:
      name: hlnasavail
    spec:
      name: Homelab — NAS (DSM) availability
      description: >-
        Share of probes for which the Synology's DSM at http://nas.sphinx-map.ts.net:5000/ answered 2xx.
      destinationDatasource:
        uid: mimir-homelab
      query:
        type: freeform
        freeform:
          query: avg_over_time(probe_success{job="blackbox", service="nas"}[$__rate_interval])
      objectives:
      - value: 0.995
        window: 28d
      labels:
      - key: service_name
        value: nas
      - key: team_name
        value: homelab
      - key: site
        value: homelab
      alerting:
        labels:
        - key: service
          value: nas
        fastBurn:
          labels:
          - key: severity
            value: critical
          annotations:
          - key: summary
            value: Homelab — NAS (DSM) availability is burning its error budget fast.
        slowBurn:
          labels:
          - key: severity
            value: warning
          annotations:
          - key: summary
            value: Homelab — NAS (DSM) availability is burning its error budget slowly.
