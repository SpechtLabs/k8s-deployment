# SLO hlk3sapiavail: Homelab — labk3s API availability. Applied to Grafana Cloud by slo-sync (slo-sync-job.yaml).
apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: hlk3sapiavail
spec:
  name: Homelab — labk3s API availability
  description: >-
    Share of probes for which the labk3s API server, probed by the collector on isa at
    https://labk3s.sphinx-map.ts.net:6443/readyz (the Tailscale Service svc:labk3s), answered
    with 401: up, serving TLS and authenticating (k3s allows no anonymous requests, so readiness
    itself isn't checked). What Argo CD and kubectl depend on.
  destinationDatasource:
    uid: mimir-homelab
  query:
    type: freeform
    freeform:
      query: avg_over_time(probe_success{job="blackbox", service="labk3s-api"}[$__rate_interval])
  objectives:
  - value: 0.995
    window: 28d
  labels:
  - key: service_name
    value: labk3s-api
  - key: team_name
    value: homelab
  - key: site
    value: homelab
  alerting:
    labels:
    - key: service
      value: labk3s-api
    fastBurn:
      labels:
      - key: severity
        value: critical
      annotations:
      - key: summary
        value: Homelab — labk3s API availability is burning its error budget fast.
      - key: runbook_url
        value: https://backstage.k8s.specht-labs.de/docs/default/system/labk3s/how-to/respond-to-a-labk3s-alert/#labk3s-api-availability
    slowBurn:
      labels:
      - key: severity
        value: warning
      annotations:
      - key: summary
        value: Homelab — labk3s API availability is burning its error budget slowly.
      - key: runbook_url
        value: https://backstage.k8s.specht-labs.de/docs/default/system/labk3s/how-to/respond-to-a-labk3s-alert/#labk3s-api-availability
