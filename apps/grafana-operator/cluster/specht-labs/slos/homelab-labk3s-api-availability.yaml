# SLO hlk3sapiavail: Homelab — labk3s API availability. Applied by grafana-operator (grafana/slos (cedi, 2026-11-24)).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: slo-hlk3sapiavail
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  template:
    apiVersion: slo.ext.grafana.app/v1alpha1
    kind: SLO
    metadata:
      name: hlk3sapiavail
    spec:
      name: Homelab — labk3s API availability
      description: >-
        Share of probes for which the labk3s API server (clusterpi-leader:6443 over the tailnet) answered
        /readyz with 401: up, serving TLS and authenticating (k3s allows no anonymous requests, so readiness
        itself isn't checked). What Argo CD and kubectl depend on.
      destinationDatasource:
        uid: mimir-homelab
      query:
        type: freeform
        freeform:
          query: avg_over_time(probe_success{job="blackbox", service="labk3s-api"}[$__rate_interval])
      objectives:
      - value: 0.995
        window: 28d
      labels:
      - key: service_name
        value: labk3s-api
      - key: team_name
        value: homelab
      - key: site
        value: homelab
      alerting:
        labels:
        - key: service
          value: labk3s-api
        fastBurn:
          labels:
          - key: severity
            value: critical
          annotations:
          - key: summary
            value: Homelab — labk3s API availability is burning its error budget fast.
        slowBurn:
          labels:
          - key: severity
            value: warning
          annotations:
          - key: summary
            value: Homelab — labk3s API availability is burning its error budget slowly.
