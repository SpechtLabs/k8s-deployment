# Ceph dashboards (ceph-mixin) for the homelab Ceph cluster on storagepi-ceph1..3,
# delivered to Grafana Cloud in Infrastructure › Ceph. JSON and its source:
# components/grafana-dashboards/ceph. Data: Mimir (homelab), cluster=homelab-ceph.
# Ceph - Status: per host, which daemons run, OSD up, mon in quorum; active
# health checks; state timelines. Generated by hack/gen-ceph-status-dashboard.py.
# The ceph-health alerts link to it (uid ceph-status).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-status
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: ceph
  configMapRef:
    name: ceph-status-json
    key: ceph-status.json
---
