# Ceph dashboards (ceph-mixin) for the homelab Ceph cluster on storagepi-ceph1..3,
# delivered to Grafana Cloud in Infrastructure › Ceph. JSON and its source:
# components/grafana-dashboards/ceph. Data: Mimir (homelab), cluster=homelab-ceph.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-cluster
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: ceph
  configMapRef:
    name: ceph-cluster-json
    key: ceph-cluster.json
---
