# GrafanaFolder hierarchy for first-party dashboards/alerts on the external Grafana
# Cloud instance. Each folder pins `uid:` to the folder the operator already created
# from the dashboards' former `folder:` strings, so the operator renames/reparents
# them IN PLACE instead of creating duplicate-titled folders. Dashboards and alert
# rules reference these by folderRef.
#
# Layout:
#   Applications              — what runs on the platform: first-party apps
#                               (static-pages, Home Assistant) and appliances
#                               (Synology, cert-checker)
#   Infrastructure            — time server, node-exporter, tailscale
#     └─ Providers            — where compute comes from: Hetzner Cloud, the Pi
#                               fleet, the compute blades
#     └─ Ceph                 — homelab Ceph cluster (ceph-mixin)
#     └─ Kubernetes Platform  — cluster add-ons (argocd, cert-manager)
#         └─ Envoy Gateway    — ingress / networking
#
# Never delete a GrafanaFolder here to rename or move it: the operator's finalizer
# deletes the folder in Grafana, and with it every dashboard and alert rule still
# inside. Change title / parentFolderRef on the existing resource instead (the
# operator moves and renames in place); spec.uid cannot be added afterwards.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: infrastructure
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  uid: bfongr6rqsbnkb
  title: "Infrastructure"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: kubernetes-platform
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  # was the "Kubernetes Infra Apps" folder — renamed in place via its existing uid.
  uid: afomtf2umwo3ka
  title: "Kubernetes Platform"
  parentFolderRef: infrastructure
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: envoy-gateway
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  uid: afon5mmmnjugwf
  title: "Envoy Gateway"
  # Nest the gateway dashboards under the platform folder (ingress/networking).
  parentFolderRef: kubernetes-platform
---
# Shared "Applications" folder for first-party app telemetry (dashboards + alert
# rules). Static Pages dashboard and its health-check alert group reference this
# via folderRef. (uid omitted — already operator-managed; left unchanged.)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: applications
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  title: "Applications"
---
# Ceph cluster on the homelab storage Pis (ceph-mixin dashboards), nested
# under Infrastructure.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: ceph
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  title: "Ceph"
  parentFolderRef: infrastructure
---
# Providers: Hetzner Cloud, the Raspberry Pi fleet, the compute blades. This was the
# "Raspberry Pi" folder; the resource keeps its old name because replacing it
# would make the operator delete the folder and everything in it.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: raspberry-pi
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  title: "Providers"
  parentFolderRef: infrastructure
