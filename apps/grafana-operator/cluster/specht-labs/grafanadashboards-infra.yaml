# Dashboards whose JSON lives in components/grafana-dashboards/infrastructure/,
# delivered via configMapRef (ConfigMaps generated there). instanceSelector binds
# them to the external Grafana Cloud instance defined in grafana.yaml. The JSON
# directory is not the Grafana folder: folderRef decides that (see
# grafana-folders.yaml). raspberry-pi is the "Providers" folder.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hcloud-servers
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: raspberry-pi
  configMapRef:
    name: hcloud-server-dashboard-json
    key: hcloud-server-dashboard.json
---
# Homelab infra dashboards. Their ${datasource} template variable defaults to the
# homelab tenant (Mimir (homelab) / uid mimir-homelab) so they show data straight
# after import; see apps/grafana-operator/.../grafanadatasources.yaml.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: infrastructure
  # NOTE: node_exporter uses polystat panels (grafana-polystat-panel). The plugin
  # cannot be installed via the operator — it rejects spec.plugins for external
  # (Cloud) Grafana — so it must be installed on the stack out-of-band.
  configMapRef:
    name: node-exporter-json
    key: node_exporter.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rpi
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: raspberry-pi
  # Uses grafana-polystat-panel; install it on the Cloud stack out-of-band (the
  # operator rejects spec.plugins for external Grafana). See node-exporter note.
  configMapRef:
    name: rpi-dashboard-json
    key: rpi_dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: compute-blades
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: raspberry-pi
  # compute-blade-agent metrics (job blade_exporter, scraped by Alloy on the
  # blades; SpechtLabs/homelab modules/compute-blade-agent). Core panels only.
  configMapRef:
    name: compute-blades-dashboard-json
    key: compute_blades.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: stratum1
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: infrastructure
  # "Time Server": timepi, the GPS/PPS Stratum 1 and PTP grandmaster: ntpsec, gpsd, PPS,
  # ptp4l/phc2sys (textfile collector, SpechtLabs/homelab modules/ptp-server) and
  # every client's chrony/ptp4l view (modules/time-sync).
  configMapRef:
    name: stratum1-dashboard-json
    key: stratum1.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ups
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: infrastructure
  # "UPS & NUT" (uid ups-nut): the UPS Tower through isa's NUT server (ups-metrics,
  # SpechtLabs/homelab modules/nut-server) and every NUT client's upsmon
  # (nut-client-metrics, modules/nut-client). Generated by hack/gen-ups-dashboard.py;
  # the ups alert rules link to its panels by id.
  configMapRef:
    name: ups-dashboard-json
    key: ups.json
---
