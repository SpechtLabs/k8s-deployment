apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana-operator

helmCharts:
  - name: grafana-operator
    repo: https://grafana.github.io/helm-charts
    version: 5.26.0
    releaseName: grafana-operator
    namespace: grafana-operator
    valuesFile: grafana-operator-values.yaml

resources:
  # Shared dashboard JSON → ConfigMaps (one source of truth with the v1 cluster).
  - ../../../../components/grafana-dashboards/kubernetes-infra-apps
  - ../../../../components/grafana-dashboards/envoy-gateway
  - ../../../../components/grafana-dashboards/infrastructure
  - ../../../../components/grafana-dashboards/static-pages
  - ../../../../components/grafana-dashboards/home-assistant
  - ../../../../components/grafana-dashboards/ceph
  - grafana.yaml
  # Folder hierarchy (Applications / Infrastructure › Providers, Ceph, Kubernetes Platform › Envoy Gateway).
  - grafana-folders.yaml
  - grafanadashboards.yaml
  - grafanadashboards-envoy.yaml
  - grafanadashboards-infra.yaml
  - grafanadashboards-static-pages.yaml
  - grafanadashboards-home-assistant.yaml
  - grafanadashboards-ceph.yaml
  # Every SLO (error budgets, with the SLO plugin's own burn alerts), as
  # GrafanaManifests the operator applies: edit them there, never with gcx.
  - slos
  # First-party app health targets (instantaneous checks).
  - grafanaalertrules-static-pages.yaml
  # Ceph cluster and ceph-csi health (homelab Mimir tenant).
  - grafanaalertrules-ceph.yaml
  # Time sync: timepi (GPS/PPS, ntpsec, PTP grandmaster) and every host's chrony/ptp4l.
  - grafanaalertrules-time-sync.yaml
  # Homelab platform: the Buckle server's database backup.
  - grafanaalertrules-homelab.yaml
  # specht-labs platform health: what the SLOs can't see (telemetry missing, SLO
  # recordings stopped, ingest stalled, restarts, nodes, certs, volumes, ArgoCD).
  - grafanaalertrules-platform.yaml
  # Where alerts go: Grafana IRM (contact point) and the notification policy tree.
  - grafanacontactpoints.yaml
  - grafananotificationpolicy.yaml
  # Self-hosted LGTM datasources (one per backend × tenant), reached over PDC.
  # gcx cannot create datasources, so they are operator-pushed here like dashboards.
  - grafanadatasources.yaml

generators:
  - secret-generator.yaml
