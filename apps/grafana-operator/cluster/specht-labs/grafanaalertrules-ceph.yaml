# Ceph and ceph-csi HEALTH TARGETS for the homelab: the Ceph cluster on
# storagepi-ceph1..3 (cluster=homelab-ceph) and ceph-csi on labk3s
# (cluster=labk3s), Grafana-managed rules on the homelab Mimir tenant, in
# Infrastructure > Ceph. A curated set, not the ceph-mixin's ~100 alerts:
# what needs a human for a 3-node, size-3 cluster. Every query was checked
# against mimir-homelab; routing by labels service (ceph, ceph-csi) and
# severity in Grafana's notification policies.
#
# Rules about a daemon, OSD, mon or health check fire once per instance and
# carry its `hostname`, so a notification says what broke and where (2026-11-25:
# "one OSD is down" didn't say which). They link to the Ceph - Status dashboard
# (hack/gen-ceph-status-dashboard.py; Grafana wants __panelId__ with
# __dashboardUid__, the generator numbers panels in order) and the runbook in
# SpechtLabs/homelab.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: ceph-health
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-cloud
  folderRef: ceph
  name: ceph-health
  interval: 1m
  rules:
  - uid: ceph-health-error
    title: Ceph — HEALTH_ERR
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      service: ceph
      category: health
    annotations:
      summary: 'Ceph HEALTH_ERR: {{ $labels.name }}'
      description: 'Health check {{ $labels.name }} has been at HEALTH_ERR for 5m. `sudo cephadm shell -- ceph health detail` on a storage Pi lists the daemons or PGs it is about; the Ceph - Status dashboard shows which host.'
      __dashboardUid__: ceph-status
      __panelId__: '9'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: max by (name) (ceph_health_detail{cluster="homelab-ceph", severity="HEALTH_ERR"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-health-warn
    title: Ceph — HEALTH_WARN
    condition: B
    for: 30m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph
      category: health
    annotations:
      summary: 'Ceph HEALTH_WARN for 30m: {{ $labels.name }}'
      description: 'Health check {{ $labels.name }} has warned for 30m. `sudo cephadm shell -- ceph health detail` on a storage Pi lists the daemons or PGs it is about; the Ceph - Status dashboard shows which host. Deliberate warnings are muted in SpechtLabs/homelab (ceph_health_mutes) and left out here by name.'
      __dashboardUid__: ceph-status
      __panelId__: '9'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        # The mgr exports muted checks as active too: keep this list in step with
        # ceph_health_mutes in SpechtLabs/homelab vars/group-ceph.yaml.
        expr: max by (name) (ceph_health_detail{cluster="homelab-ceph", severity="HEALTH_WARN", name!~"AUTH_INSECURE_CLIENT_KEY_TYPE|AUTH_INSECURE_KEYS_ALLOWED|AUTH_INSECURE_KEYS_CREATABLE"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-metrics-absent
    title: Ceph — no cluster metrics
    condition: B
    for: 10m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      service: ceph
      category: health
    annotations:
      summary: No metrics from the Ceph cluster
      description: 'No active mgr has reported ceph_health_status for 10m: every mgr is down, the prometheus module is off, or Alloy on the storage Pis can''t write.'
      __dashboardUid__: ceph-status
      __panelId__: '18'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: count(ceph_health_status{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-osd-down
    title: Ceph — OSD down
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph
      category: health
    annotations:
      summary: 'Ceph {{ $labels.ceph_daemon }} on {{ $labels.hostname }} is down'
      description: '{{ $labels.ceph_daemon }} on {{ $labels.hostname }} has been down for 5m. With 3 replicas and min_size 2 the cluster still serves I/O with one OSD down; two down block writes. On {{ $labels.hostname }}: `sudo systemctl status ceph-<fsid>@{{ $labels.ceph_daemon }}`.'
      __dashboardUid__: ceph-status
      __panelId__: '11'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: max by (ceph_daemon) (ceph_osd_up{cluster="homelab-ceph"}) * on(ceph_daemon) group_left(hostname) max by (ceph_daemon, hostname) (ceph_osd_metadata{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-pgs-inactive
    title: Ceph — placement groups inactive
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: critical
      service: ceph
      category: health
    annotations:
      summary: Ceph placement groups are inactive
      description: 'Some PGs have not been active for 10m: the data in them can''t be read or written (fewer than min_size OSDs, or stuck peering). The Ceph - Status dashboard shows which OSDs and hosts are down.'
      __dashboardUid__: ceph-status
      __panelId__: '8'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: sum(ceph_pg_total{cluster="homelab-ceph"}) - sum(ceph_pg_active{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-mon-quorum
    title: Ceph — monitor out of quorum
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph
      category: health
    annotations:
      summary: 'Ceph {{ $labels.ceph_daemon }} on {{ $labels.hostname }} is out of quorum'
      description: '{{ $labels.ceph_daemon }} on {{ $labels.hostname }} has been out of quorum for 5m. The cluster keeps working with 2 of 3 mons; losing a second stops it. On {{ $labels.hostname }}: `sudo systemctl status ceph-<fsid>@{{ $labels.ceph_daemon }}`.'
      __dashboardUid__: ceph-status
      __panelId__: '12'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: max by (ceph_daemon) (ceph_mon_quorum_status{cluster="homelab-ceph"}) * on(ceph_daemon) group_left(hostname) max by (ceph_daemon, hostname) (ceph_mon_metadata{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-osd-nearfull
    title: Ceph — OSD over 75% full
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph
      category: health
    annotations:
      summary: 'Ceph {{ $labels.ceph_daemon }} on {{ $labels.hostname }} is over 75% full'
      description: Ceph's nearfull is 85% and it stops writes at 95%; every PG lives on all three OSDs, so they fill together. Free space or add capacity.
      __dashboardUid__: ceph-status
      __panelId__: '11'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: max by (ceph_daemon) (ceph_osd_stat_bytes_used{cluster="homelab-ceph"} / ceph_osd_stat_bytes{cluster="homelab-ceph"}) * on(ceph_daemon) group_left(hostname) max by (ceph_daemon, hostname) (ceph_osd_metadata{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.75
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: ceph-daemon-down
    title: Ceph — daemon not running
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph
      category: health
    annotations:
      summary: 'Ceph {{ $labels.daemon_name }} on {{ $labels.hostname }} is not running'
      description: 'cephadm has reported {{ $labels.daemon_name }} ({{ $labels.service_type }}) on {{ $labels.hostname }} as not running for 10m (status {{ $values.A.Value }}: 0 stopped, -1 error, 2 starting, -2 unknown). Several daemons on one host at once: the host or its Docker. On {{ $labels.hostname }}: `sudo systemctl status ceph-<fsid>@{{ $labels.daemon_name }}`; restart with `sudo cephadm shell -- ceph orch daemon restart {{ $labels.daemon_name }}`.'
      __dashboardUid__: ceph-status
      __panelId__: '10'
      runbook_url: https://github.com/SpechtLabs/homelab/blob/main/docs/ceph.md#when-an-alert-fires
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        # cephadm's inventory (`ceph orch ps`), refreshed every few minutes:
        # every daemon it deployed, mons and OSDs included, and the ones the
        # other rules don't watch (mgr standbys, RGW, crash, ceph-exporter).
        expr: max by (hostname, daemon_name, service_type) (ceph_cephadm_daemon_status{cluster="homelab-ceph"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: math
        datasource:
          type: __expr__
          uid: __expr__
        expression: $A != 1
        refId: B
  - uid: csi-provisioner-down
    title: Ceph CSI — no provisioner
    condition: B
    for: 5m
    noDataState: Alerting
    execErrState: Error
    labels:
      severity: critical
      service: ceph-csi
      category: health
    annotations:
      summary: No live ceph-csi provisioner on labk3s
      description: 'No provisioner pod reports csi_liveness: new PVCs on ceph-rbd stay Pending, attach/expand stop.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: sum(csi_liveness{cluster="labk3s", job="ceph-csi-rbd/provisioner"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: csi-nodeplugin-missing
    title: Ceph CSI — node plugin missing
    condition: B
    for: 10m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph-csi
      category: health
    annotations:
      summary: A labk3s node has no live ceph-csi node plugin
      description: Pods with ceph-rbd volumes can't start on that node (no mount/unmount).
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: count(kube_node_info{cluster="labk3s"}) - (sum(csi_liveness{cluster="labk3s", job="ceph-csi-rbd/nodeplugin"}) or vector(0))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: csi-operation-errors
    title: Ceph CSI — volume operations failing
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph-csi
      category: health
    annotations:
      summary: ceph-csi volume operations are failing
      description: Create/delete/attach/expand calls have returned gRPC errors for 15m. The Ceph CSI (RBD) dashboard shows which method; the provisioner logs say why.
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: sum(rate(csi_sidecar_operations_seconds_count{cluster="labk3s", driver_name="rbd.csi.ceph.com", grpc_status_code!="OK"}[10m])) or vector(0)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
  - uid: csi-pvc-nearfull
    title: Ceph CSI — PVC over 85% full
    condition: B
    for: 15m
    noDataState: OK
    execErrState: Error
    labels:
      severity: warning
      service: ceph-csi
      category: health
    annotations:
      summary: A ceph-rbd PVC is over 85% full
      description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full. ceph-rbd volumes can be expanded: raise the PVC''s request.'
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: mimir-homelab
      model:
        datasource:
          type: prometheus
          uid: mimir-homelab
        editorMode: code
        expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster="labk3s"} / kubelet_volume_stats_capacity_bytes{cluster="labk3s"} and on(namespace, persistentvolumeclaim)
          kube_persistentvolumeclaim_info{cluster="labk3s", storageclass="ceph-rbd"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        conditions:
        - type: query
          evaluator:
            type: gt
            params:
            - 0.85
          operator:
            type: and
          query:
            params:
            - A
          reducer:
            type: last
            params: []
        refId: B
