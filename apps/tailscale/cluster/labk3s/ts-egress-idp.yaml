apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/tailnet-fqdn: idp.sphinx-map.ts.net
    # A tsidp relying party (labk3s Argo CD's OIDC calls): SpechtLabs/homelab's policy
    # grants tag:tsidp-client tcp:443 on idp. The operator applies tags only
    # when it creates the proxy: after changing them, delete this Service and
    # let Argo CD re-create it.
    tailscale.com/tags: tag:tsidp-client
  name: k3s-idp-egress
spec:
  externalName: placeholder # any value - will be overwritten by operator
  type: ExternalName
