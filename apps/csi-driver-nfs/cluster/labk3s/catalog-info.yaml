# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: csi-driver-nfs
  annotations:
    # ArgoCD cards from the labk3s ArgoCD, through Backstage's /argocd/labk3s
    # proxy. No Kubernetes annotations: the Kubernetes plugin only knows
    # specht-labs, where the same selectors would match the wrong pods.
    argocd/app-name: csi-driver-nfs
    argocd/proxy-url: /argocd/labk3s
  title: NFS CSI driver
  description: NFS volumes for labk3s (v4.13.4 manifests, with the kubelet paths patched for k3s).
  tags: [storage, nfs]
  links:
    - url: https://github.com/kubernetes-csi/csi-driver-nfs
      title: kubernetes-csi/csi-driver-nfs
      icon: github
spec:
  type: service
  lifecycle: experimental
  owner: group:spechtlabs
  system: homelab
  consumesApis:
    - api:nas-nfs
  dependsOn:
    - resource:labk3s
