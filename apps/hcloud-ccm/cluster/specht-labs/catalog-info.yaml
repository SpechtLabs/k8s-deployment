# Backstage catalog: this app's entities. Not part of the kustomization;
# Backstage reads it through the Location in the repo-root catalog-info.yaml.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hcloud-ccm
  title: Hetzner Cloud controller manager
  description: Node lifecycle, routes and load balancers for Services, from the Hetzner Cloud API.
  annotations:
    argocd/app-name: hcloud-ccm
    backstage.io/kubernetes-namespace: kube-system
    backstage.io/kubernetes-label-selector: app.kubernetes.io/instance=hcloud-ccm
  tags: [hetzner]
  links:
    - url: https://github.com/hetznercloud/hcloud-cloud-controller-manager
      title: hetznercloud/hcloud-cloud-controller-manager
      icon: github
spec:
  type: service
  lifecycle: production
  owner: group:spechtlabs
  system: specht-labs
  consumesApis:
    - api:hetzner-cloud-api
  dependsOn:
    - resource:specht-labs
