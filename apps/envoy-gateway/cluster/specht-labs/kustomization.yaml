apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - ../../base/
  - bogen-web-certificate.yaml
  - tunnel-hornberg-certificate.yaml
  - tailscale-envoyproxy.yaml
  - tailscale-gatewayclass.yaml
  - tailscale-gateway.yaml
  - metrics-monitors.yaml
  - proxy-protocol.yaml

# Annotate the shared base's hetzner-lb EnvoyProxy with the external-dns hostnames here (not in the
# base) so specht-labs.de ownership stays cluster-specific.
patches:
  - path: hetzner-lb-externaldns.patch.yaml
    target:
      kind: EnvoyProxy
      name: hetzner-lb
  - path: hetzner-lb-proxyprotocol.patch.yaml
    target:
      kind: EnvoyProxy
      name: hetzner-lb
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: shared
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: bogen-web
          protocol: HTTPS
          port: 443
          hostname: bogen.kienzlers-world.de
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: bogen-web-tls
          allowedRoutes:
            namespaces:
              from: All
      - op: add
        path: /spec/listeners/-
        value:
          name: tunnel-hornberg
          protocol: HTTPS
          port: 443
          hostname: tunnel.kienzlers-world.de
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: tunnel-hornberg-tls
          allowedRoutes:
            namespaces:
              from: All
      # gibson: `ssh specht-labs.de` plays the SpechtLabs intro. A plain TCP
      # listener (SSH has no SNI to route on), so the port is gibson's alone and
      # only its namespace may attach a route.
      - op: add
        path: /spec/listeners/-
        value:
          name: ssh
          protocol: TCP
          port: 22
          allowedRoutes:
            kinds:
              - kind: TCPRoute
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: gibson
      - op: add
        path: /spec/listeners/-
        value:
          name: tunnel-hornberg-de
          protocol: HTTPS
          port: 443
          hostname: tunnel-hornberg.de
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: tunnel-hornberg-tls
          allowedRoutes:
            namespaces:
              from: All
