apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - ../../base/
  - bogen-web-certificate.yaml
  - tailscale-envoyproxy.yaml
  - tailscale-gatewayclass.yaml
  - tailscale-gateway.yaml
  - metrics-monitors.yaml

# Annotate the shared base's hetzner-lb EnvoyProxy with the external-dns hostnames here (not in the
# base) so specht-labs.de ownership stays cluster-specific.
patches:
  - path: hetzner-lb-externaldns.patch.yaml
    target:
      kind: EnvoyProxy
      name: hetzner-lb
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: shared
    patch: |-
      - op: add
        path: /spec/listeners/-
        value:
          name: bogen-web
          protocol: HTTPS
          port: 443
          hostname: bogen.kienzlers-world.de
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: bogen-web-tls
          allowedRoutes:
            namespaces:
              from: All
