# The tailnet Gateway's Envoy. Its own Service is ClusterIP only: tailnet
# clients reach the pods through the Tailscale Services in tailnet-services.yaml
# (svc:lgtm, svc:argocd, svc:backstage), which also carry the external-dns
# records. The k8s-load-balancer device that used to front it is gone.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: tailscale-lb
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      envoyService:
        type: ClusterIP
