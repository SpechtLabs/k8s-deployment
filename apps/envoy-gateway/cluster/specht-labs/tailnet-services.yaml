# The tailnet Gateway's Envoy pods as Tailscale Services, served by the
# tailnet-ingress ProxyGroup (../../../tailscale/cluster/specht-labs/
# tailnet-ingress.proxygroup.yaml). The operator names each Tailscale Service
# svc:<tailscale.com/hostname> and gives it a VIP that outlives any proxy.
#
#   svc:lgtm       tcp:80   Loki/Mimir/Tempo/Pyroscope push and query, Host- or
#                           path-routed (*.k8s.specht-labs.de, lgtm.<tailnet>)
#   svc:argocd     tcp:443  argocd.k8s.specht-labs.de (TLS passthrough)
#   svc:backstage  tcp:443  backstage.k8s.specht-labs.de (HTTPS)
#
# One Kubernetes Service per Tailscale Service: the proxies DNAT a VIP to one
# ClusterIP, and kube-proxy only forwards the ports listed, so each VIP offers
# just its ports and the policy grants each one separately.
#
# Envoy Gateway owns the pods and its own Service (tailscale-envoyproxy.yaml),
# so these select its pods by its labels and target its container ports: it
# listens on port+10000 for ports below 1024 (80 -> 10080, 443 -> 10443).
# Check both after an Envoy Gateway upgrade.
#
# Don't delete or rename these Services, or change tailscale.com/hostname or
# tailscale.com/proxy-group: the operator deletes the Tailscale Service with
# them, and a re-created one gets a new VIP, which the DNS records pin.
#
# tailscale.com/tags here tags the Tailscale Service, not the proxies (those
# carry the ProxyGroup's tags). tag:k8s is the operator's default and is in no
# grant: access goes by svc: name only.
#
# The cluster is IPv4-only, so the proxies map only the VIP's IPv4 address
# (the IPv6 one goes nowhere): DNS for these is A records only.
apiVersion: v1
kind: Service
metadata:
  name: tailnet-lgtm
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
    tailscale.com/hostname: lgtm
    tailscale.com/tags: tag:k8s
    # A only, pinned to svc:lgtm's VIP (the status also carries the MagicDNS
    # hostname, which external-dns would publish as a conflicting CNAME).
    # Every LGTM hostname is listed explicitly: explicit names override the
    # wildcard, and they answer AAAA with NODATA instead of the wildcard's stale
    # AAAA (the removed k8s-load-balancer device). The *.k8s.specht-labs.de A record
    # itself has no edns- ownership TXT (it predates external-dns owning it), so
    # external-dns leaves it alone; it is listed for when it is adopted.
    # A new tenant hostname needs adding here.
    external-dns.kubernetes.io/hostname: "*.k8s.specht-labs.de,homelab-loki.k8s.specht-labs.de,homelab-mimir.k8s.specht-labs.de,homelab-tempo.k8s.specht-labs.de,homelab-pyroscope.k8s.specht-labs.de,hass-loki.k8s.specht-labs.de,hass-mimir.k8s.specht-labs.de,hass-tempo.k8s.specht-labs.de,hass-pyroscope.k8s.specht-labs.de,hass-schiltach-loki.k8s.specht-labs.de,hass-schiltach-mimir.k8s.specht-labs.de,hass-schiltach-tempo.k8s.specht-labs.de,hass-schiltach-pyroscope.k8s.specht-labs.de,spechtlabs-loki.k8s.specht-labs.de,spechtlabs-mimir.k8s.specht-labs.de,spechtlabs-tempo.k8s.specht-labs.de,spechtlabs-pyroscope.k8s.specht-labs.de"
    external-dns.kubernetes.io/target: "100.102.186.94"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: tailnet
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 10080
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-argocd
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
    tailscale.com/hostname: argocd
    tailscale.com/tags: tag:k8s
    # A only, pinned to svc:argocd's VIP: the status also carries the MagicDNS
    # hostname, which external-dns would publish as a conflicting CNAME. This
    # explicit record overrides *.k8s.specht-labs.de for the name.
    # external-dns v0.24 reads only the external-dns.kubernetes.io/ prefix
    # (the legacy .alpha. one needs --enable-legacy-annotation-prefix).
    external-dns.kubernetes.io/hostname: argocd.k8s.specht-labs.de
    external-dns.kubernetes.io/target: "100.93.249.30"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: tailnet
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 10443
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-backstage
  namespace: envoy-gateway-system
  annotations:
    tailscale.com/proxy-group: tailnet-ingress
    tailscale.com/hostname: backstage
    tailscale.com/tags: tag:k8s
    # A only, pinned to svc:backstage's VIP: the status also carries the MagicDNS
    # hostname, which external-dns would publish as a conflicting CNAME. This
    # explicit record overrides *.k8s.specht-labs.de for the name.
    # external-dns v0.24 reads only the external-dns.kubernetes.io/ prefix
    # (the legacy .alpha. one needs --enable-legacy-annotation-prefix).
    external-dns.kubernetes.io/hostname: backstage.k8s.specht-labs.de
    external-dns.kubernetes.io/target: "100.93.117.9"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: envoy-gateway
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: tailnet
    gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 10443
