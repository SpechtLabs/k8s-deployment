apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tka-system

helmCharts:
  - name: tka
    repo: https://charts.specht-labs.de
    version: 0.1.12
    releaseName: tka
    namespace: tka-system
    valuesFile: helm-values.yaml
    # Always render the ServiceMonitor/PrometheusRule so the labk3s overlay's
    # `$patch: delete` has a target, even though that cluster lacks the CRDs.
    apiVersions:
      - monitoring.coreos.com/v1
