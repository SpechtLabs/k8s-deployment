apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: hlcephavail
spec:
  name: Homelab — Ceph availability
  description: >-
    Share of minutes in which the homelab Ceph cluster (storagepi-ceph1..3) was not HEALTH_ERR and every placement group was active, i.e. RBD volumes on labk3s and RGW could read and write. 100% over the 7 days before 2026-11-24.
  destinationDatasource:
    uid: mimir-homelab
  query:
    type: freeform
    freeform:
      query: >-
        avg_over_time(((max(ceph_health_status{cluster="homelab-ceph"}) < bool 2) * (sum(ceph_pg_active{cluster="homelab-ceph"}) >= bool sum(ceph_pg_total{cluster="homelab-ceph"})))[$__rate_interval:1m])
  objectives:
    - value: 0.999
      window: 28d
  labels:
    - key: service
      value: ceph
    - key: site
      value: homelab
  alerting:
    labels:
      - key: service
        value: ceph
    fastBurn:
      labels:
        - key: severity
          value: critical
      annotations:
        - key: summary
          value: Homelab — Ceph availability is burning its error budget fast.
    slowBurn:
      labels:
        - key: severity
          value: warning
      annotations:
        - key: summary
          value: Homelab — Ceph availability is burning its error budget slowly.
