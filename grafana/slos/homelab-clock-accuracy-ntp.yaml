apiVersion: slo.ext.grafana.app/v1alpha1
kind: SLO
metadata:
  name: hlclockntp
spec:
  name: Homelab — clock accuracy (NTP clients)
  description: >-
    Share of host-minutes in which an NTP client's clock (chrony polling timepi over the LAN: the Pi 4 workers, the NUC, isa) was within 100 µs of its source. NTP without hardware timestamps normally holds ~0.1-10 µs; 7-day baseline before 2026-11-24: 99.90% within 100 µs, 99.986% within 1 ms.
    Offsets are chrony's to its source, so this measures distribution across
    the LAN; whether timepi itself is on GPS time is the timepi stratum-1 SLO.
  destinationDatasource:
    uid: mimir-homelab
  query:
    type: freeform
    freeform:
      query: >-
        sum(count_over_time(((abs(chrony_tracking_system_offset_seconds) unless on(instance) ptp4l_port_slave) < 0.0001)[$__rate_interval:1m])) / sum(count_over_time((abs(chrony_tracking_system_offset_seconds) unless on(instance) ptp4l_port_slave)[$__rate_interval:1m]))
  objectives:
    - value: 0.995
      window: 28d
  labels:
    - key: service
      value: time-sync
    - key: site
      value: homelab
  alerting:
    labels:
      - key: service
        value: time-sync
    fastBurn:
      labels:
        - key: severity
          value: critical
      annotations:
        - key: summary
          value: Homelab — clock accuracy (NTP clients) is burning its error budget fast (clocks more than 100 µs off).
    slowBurn:
      labels:
        - key: severity
          value: warning
      annotations:
        - key: summary
          value: Homelab — clock accuracy (NTP clients) is burning its error budget slowly.
