name: CI

# Lints the repository and validates every manifest Argo CD applies, on pull
# requests and on main, which Argo CD deploys from.
on:
  # The filter excludes rather than lists, so a new directory or config file
  # runs CI by default.
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first, argocd,
  # clusterctl and kubectl included, which no job runs.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.7
  # Every tool a CI job runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache that main's runs save
  # and every pull request restores. ksops is the kustomize exec plugin for
  # the SOPS secret generators; it needs sops and age, and yq runs
  # hack/ksops-stub, which stands in for it without an age key.
  MISE_TOOLS: kustomize helm kubeconform ksops sops age yq yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # yamllint writes GitHub annotations when it runs in Actions, so its
      # findings show up on the PR diff.
      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  validate:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # Renders every app overlay (with the Helm charts it inflates) and
      # validates it and the plain manifests against the Kubernetes schemas.
      - name: Validate manifests
        run: mise run validate
