apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bogen-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: bogen-web
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/bogen-web/cluster/specht-labs
    repoURL: https://github.com/SpechtLabs/k8s-deployment.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Reject any pod that is not fully restricted (root, privileged, host
    # namespaces, added capabilities), even if a later change asks for one.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
