apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bogen-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: bogen-web
    server: https://kubernetes.default.svc
  project: default
  source:
    path: apps/bogen-web/cluster/specht-labs
    repoURL: https://github.com/SpechtLabs/k8s-deployment.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
