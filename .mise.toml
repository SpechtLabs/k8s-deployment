# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how the manifests are validated. CI uses these tasks.
# Renovate keeps every pin in this file current.

[settings]
# The pins below are the only source of tool versions.
idiomatic_version_file_enable_tools = []

[tools]
age = "1.3.2"
argocd = "3.5.3"
clusterctl = "1.14.2"
helm = "4.3.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
ksops = "4.5.1"
kustomize = "5.8.2"
sops = "3.13.3"

# Linters
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Strips the sops metadata in hack/ksops-stub (see the check-apps task)
yq = "4.54.1"

[env]
KUBECONFIG = "{{env.HOME}}/.kube/configs/specht-labs"

[tasks.check-manifests]
description = "Validate plain Kubernetes manifests with kubeconform"
run = '''
set -e
for manifest in ./manifests/*/*.yaml; do
  if [ "$manifest" = "./manifests/deploy-secrets/helm.secret.yaml" ]; then
    continue
  fi
  echo "$manifest"
  kubeconform -ignore-missing-schemas -strict -summary "$manifest"
done
'''

[tasks.check-apps]
description = "Render each app cluster overlay and validate with kubeconform"
# The overlays with SOPS secrets render through ksops, which needs an age key
# to decrypt them. Without one (in CI, say) the stand-in under hack/ksops-stub,
# kustomize's plugin directory for the ksops generator, takes its place and
# renders the secrets still encrypted, so those overlays are validated
# too rather than failing to render. pipefail makes a failed render fail the
# task: without it, kubeconform validated the empty output and passed.
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${SOPS_AGE_KEY:-}" ] && [ -z "${SOPS_AGE_KEY_FILE:-}" ] && [ ! -f "${XDG_CONFIG_HOME:-$HOME/.config}/sops/age/keys.txt" ]; then
  echo "No age key configured: rendering SOPS secrets still encrypted (hack/ksops-stub)"
  export KUSTOMIZE_PLUGIN_HOME="$PWD/hack/ksops-stub"
fi
for kust in ./apps/*/cluster/*; do
  echo "$kust"
  kustomize build --enable-alpha-plugins --enable-helm "$kust" | kubeconform -ignore-missing-schemas -strict -summary -
done
'''

[tasks.validate]
description = "Run all kubeconform validation checks"
depends = ["check-manifests", "check-apps"]

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.lint]
description = "Lint YAML and workflows"
depends = ["yaml-lint", "actionlint"]

[tasks.check]
description = "The definition of done: every gate CI runs"
depends = ["lint", "validate"]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run"
